[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regime-retrieval"
version = "0.1.0"
description = "Causal intraday historical-analogue research"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2.4", "pandas>=2.2,<3", "pyarrow>=15", "scipy>=1.12",
  "pydantic>=2.7,<3", "PyYAML>=6", "exchange-calendars>=4.5,<5",
  "jinja2>=3.1", "matplotlib>=3.8",
  "hmmlearn>=0.3.3,<0.4", "threadpoolctl>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
regime-retrieval = "regime_retrieval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regime_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
